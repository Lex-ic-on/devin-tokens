[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devin-tokens"
version = "0.1.0"
description = "Aggregate Devin CLI token usage from local transcript files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Lex-ic-on" },
]
keywords = ["devin", "cli", "token", "usage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
devin-tokens = "devin_tokens.cli:main"
